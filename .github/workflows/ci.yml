name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  vet-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ocpctl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/ocpctl_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt (check formatting)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./cmd/...

      - name: go test (race + coverage)
        run: |
          # Per-package coverage lines are printed by `go test` itself; the merged
          # profile feeds the total. tee preserves them for the summary step.
          go test -race -covermode=atomic -coverprofile=coverage.out ./... \
            | tee test-output.txt

      - name: Coverage summary
        if: always()
        run: |
          if [ ! -f coverage.out ]; then
            echo "No coverage profile produced (tests failed to compile?)."
            exit 0
          fi
          total=$(go tool cover -func=coverage.out | tail -1 | awk '{print $NF}')
          echo "Total coverage: ${total}"
          {
            echo "### Test coverage — total: ${total}"
            echo ""
            echo "Per-package (statements):"
            echo '```'
            # Package-level lines from the test run: "ok <pkg> ... coverage: X%"
            # and "<pkg> [no test files]".
            grep -E 'coverage:|no test files' test-output.txt \
              | sed -E 's#github.com/tsanders-rh/ocpctl/##' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # NOTE: golangci-lint is intentionally NOT wired up yet.
  # The last v1 release (v1.64.8) is built with go1.24 and refuses to run
  # against a go1.25 module ("Go language version used to build golangci-lint
  # is lower than the targeted Go version"). Enabling it requires migrating
  # .golangci.yml to the v2 config format and bumping the action to v2.
  # Tracked as follow-up hardening (see docs/development/CONTRIBUTING.md §6).

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci
        run: npm ci
      - name: next lint
        run: npm run lint
      - name: next build
        run: npm run build

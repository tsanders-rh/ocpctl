name: ibmcloud-standard
displayName: IBM Cloud Standard Development Cluster
description: Standard 6-node cluster with dedicated workers for IBM Cloud development
platform: ibmcloud
clusterType: openshift
track: ga
enabled: true
openshiftVersions:
  allowlist:
  - '4.17'
  - '4.18'
  - '4.19'
  - '4.20'
  - '4.21'
  - '4.22'
  default: '4.22'
regions:
  allowlist:
  - us-south
  - us-east
  - eu-de
  default: us-south
baseDomains:
  allowlist:
  - ibm.mg.dog8code.com
  default: ibm.mg.dog8code.com
compute:
  controlPlane:
    replicas: 3
    instanceType: bx2-4x16
    schedulable: false
  workers:
    replicas: 3
    minReplicas: 0
    maxReplicas: 10
    instanceType: bx2-8x32
    autoscaling: false
lifecycle:
  maxTTLHours: 168
  defaultTTLHours: 72
  allowCustomTTL: true
  warnBeforeDestroyHours: 2
networking:
  networkType: OVNKubernetes
  clusterNetworks:
  - cidr: 10.128.0.0/14
    hostPrefix: 23
  serviceNetwork:
  - 172.30.0.0/16
  machineNetwork:
  - cidr: 10.0.0.0/16
tags:
  required:
    Environment: development
  defaults:
    Purpose: development
    ManagedBy: cluster-control-plane
  allowUserTags: true
features:
  # Off-hours scaling hibernates by stopping the cluster's VPC VSIs
  # (`ibmcloud is instance-stop`) and resumes with `instance-start` (see
  # handler_hibernate_ibmcloud.go / handler_resume_ibmcloud.go).
  offHoursScaling: true
  fipsMode: false
  privateCluster: false
costControls:
  # List-price basis: ROKS: 3x bx2-4x16 @0.194 + 3x bx2-8x32 @0.388 + infra (IBM list)
  estimatedHourlyCost: 2.0
  maxMonthlyCost: 1460
  budgetAlertThreshold: 0.8
platformConfig:
  ibmcloud:
    resourceGroup: Default
metadata:
  notes:
    - "OCP 4.22 GA is supported (default). Provisioning uses manual CCO mode: openshift-install create manifests -> ccoctl ibmcloud (service IDs) -> openshift-install create cluster."
    - "Hibernate is NOT implemented for IBM Cloud OpenShift and falls back to destroy; off-hours scaling is disabled to avoid destroying idle clusters."
    - "Requires IBMCLOUD_API_KEY on workers (via worker.env / ibmcloud-login.sh) and versioned ccoctl-4.x + openshift-install-4.x (installed by ensure-installers.sh)."

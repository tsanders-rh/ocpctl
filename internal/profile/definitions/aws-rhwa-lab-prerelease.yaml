name: aws-rhwa-lab-prerelease
displayName: AWS RHWA Lab (Prerelease)
description: Compact 3-node cluster for RHWA/Medik8s node remediation testing with
  pre-release OpenShift versions (EC, RC, nightly builds). Control plane is schedulable.
  Uses Auto credentials mode for OpenShift 5.0 compatibility.
platform: aws
clusterType: openshift
track: prerelease
enabled: true
credentialsMode: Auto
openshiftVersions:
  allowlist:
  - 4.22.0-ec.5
  - 5.0.0-ec.5
  - 5.0.0-0.nightly
  default: 4.22.0-ec.5
regions:
  allowlist:
  - us-east-1
  - us-east-2
  - us-west-1
  - us-west-2
  default: us-east-1
baseDomains:
  allowlist:
  - mg.dog8code.com
  default: mg.dog8code.com
compute:
  controlPlane:
    replicas: 3
    instanceType: m6i.xlarge
    schedulable: true
  workers:
    replicas: 0
    minReplicas: 0
    maxReplicas: 6
    instanceType: m6i.xlarge
    autoscaling: false
lifecycle:
  maxTTLHours: 168
  defaultTTLHours: 24
  allowCustomTTL: true
  warnBeforeDestroyHours: 2
networking:
  networkType: OVNKubernetes
  clusterNetworks:
  - cidr: 10.128.0.0/14
    hostPrefix: 23
  serviceNetwork:
  - 172.30.0.0/16
  machineNetwork:
  - cidr: 10.0.0.0/16
tags:
  required:
    Environment: test
  defaults:
    Purpose: rhwa-medik8s-prerelease-testing
    ManagedBy: cluster-control-plane
    Track: prerelease
    Category: node-remediation
  allowUserTags: true
features:
  offHoursScaling: true
  fipsMode: false
  privateCluster: false
costControls:
  # List-price basis: OCP IPI: 3x m6i.xlarge @0.192 (0 workers) + infra (us-east-1)
  estimatedHourlyCost: 0.7
  maxMonthlyCost: 510
  budgetAlertThreshold: 0.8
platformConfig:
  aws:
    instanceMetadataService: required
    rootVolume:
      type: gp3
      size: 120
      iops: 3000
defaultAddons:
  - addonID: rhwa
    version: stable
metadata:
  notes:
  - Optimized for RHWA/Medik8s node remediation testing with prerelease OpenShift
  - Uses Auto credentials mode for OpenShift 5.0 compatibility
  - Control plane schedulable (3 nodes suitable for compact testing)
  - Use with rhwa addon for complete operator installation
  - 'Estimated cost: $0.77/hr ($18/day with hibernation)'
  - 'Supports OpenShift 4.22 EC builds, 5.0 EC builds, and 5.0 nightly builds'
  warnings:
  - Auto credentials mode may have limited IAM permissions for some failure injection scenarios
  - For full AWS access use the GA aws-rhwa-lab profile with Manual credentials
  - Failure injection tests may temporarily impact node availability
  - 'Prerelease versions may have bugs or breaking changes'

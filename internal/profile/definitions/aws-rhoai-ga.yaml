name: aws-rhoai-ga
displayName: AWS Red Hat OpenShift AI (GA)
description: Cluster sized for Red Hat OpenShift AI 3.5 self-managed - dashboard, workbenches
  (Jupyter), and AI pipelines on CPU workers (m6i.4xlarge)
platform: aws
clusterType: openshift
track: ga
enabled: true
credentialsMode: Auto
openshiftVersions:
  # RHOAI 3.5 requires OpenShift 4.19.9 or later
  allowlist:
  - '4.19'
  - '4.20'
  - '4.21'
  - '4.22'
  default: '4.22'
regions:
  allowlist:
  - us-east-1
  - us-east-2
  - us-west-1
  - us-west-2
  - eu-west-1
  - eu-central-1
  default: us-east-1
baseDomains:
  allowlist:
  - mg.dog8code.com
  default: mg.dog8code.com
compute:
  controlPlane:
    replicas: 3
    instanceType: m6i.2xlarge
    schedulable: false
  workers:
    replicas: 3
    minReplicas: 3
    maxReplicas: 6
    instanceType: m6i.4xlarge
    autoscaling: false
lifecycle:
  maxTTLHours: 168
  defaultTTLHours: 72
  allowCustomTTL: true
  warnBeforeDestroyHours: 2
networking:
  networkType: OVNKubernetes
  clusterNetworks:
  - cidr: 10.128.0.0/14
    hostPrefix: 23
  serviceNetwork:
  - 172.30.0.0/16
  machineNetwork:
  - cidr: 10.0.0.0/16
tags:
  required:
    Environment: lab
  defaults:
    Purpose: ai-ml
    ManagedBy: cluster-control-plane
    Workload: openshift-ai
    Track: ga
    Category: ai
  allowUserTags: true
features:
  # Off-hours worker scaling is disabled: scaling workers down evicts the RHOAI
  # dashboard, workbenches, and running pipelines. Use hibernation or TTL instead.
  offHoursScaling: false
  fipsMode: false
  privateCluster: false
costControls:
  # List-price basis: 3x m6i.2xlarge @0.384 + 3x m6i.4xlarge @0.768 + infra (us-east-1)
  estimatedHourlyCost: 3.75
  maxMonthlyCost: 2750
  budgetAlertThreshold: 0.8
  warningMessage: 3x m6i.4xlarge + 3x m6i.2xlarge cost ~$3.46/hr ($2,525/month).
platformConfig:
  aws:
    instanceMetadataService: required
    rootVolume:
      type: gp3
      # 200 GiB (vs the usual 120): RHOAI workbench images are multi-GiB and several
      # are pulled per node.
      size: 200
      iops: 3000
defaultAddons:
  - addonID: rhoai
    version: stable-3.5
metadata:
  capabilities:
  - ai-ml
  - jupyter-workbenches
  - ai-pipelines
  notes:
  - Workers sized for RHOAI (m6i.4xlarge, 16 vCPU / 64 GiB each, 48 vCPU / 192 GiB aggregate)
  - Exceeds the RHOAI minimum of 2 nodes x 8 vCPU / 32 GiB, leaving room for several
    Medium/Large workbenches plus pipeline runs
  - rhoai addon (stable-3.5) pre-selected - dashboard, workbenches, and AI pipelines
  - 'KServe model serving is NOT enabled: swap the addon version to stable-3.5-serving
    (adds cert-manager) and expect to raise worker count'
  - 'No GPUs: profiles support a single worker pool of one instance type. For accelerated
    workloads add a GPU MachineSet (g5/g6) plus the NVIDIA GPU operator after install'
  - RHOAI requires a default StorageClass - gp3-csi is the IPI default and satisfies this
  - 'Estimated cost: $3.75/hr - hibernate when idle'

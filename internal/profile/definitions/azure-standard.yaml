name: azure-standard
displayName: Azure OpenShift Standard (IPI multi-node)
description: Standard 3-master, 3-worker OpenShift cluster on Azure VMs
platform: azure
clusterType: openshift
track: ga
enabled: true
openshiftVersions:
  allowlist:
  - '4.18'
  - '4.19'
  - '4.20'
  - '4.21'
  - '4.22'
  default: '4.22'
regions:
  # User-selectable regions. Zone/SKU capacity within a region is NOT decided
  # here: Azure availability zones have independent, fluctuating capacity that
  # `az vm list-skus` does not reliably predict, so the worker runs a real
  # allocation probe (throwaway `az vm create`) at create time and pins the
  # cluster to the first capacityFallback candidate whose zones actually allocate.
  # See platformConfig.azure.capacityFallback below.
  allowlist:
  - eastus
  - eastus2
  - centralus
  default: eastus
baseDomains:
  allowlist:
  - azure.mg.dog8code.com
  default: azure.mg.dog8code.com
compute:
  controlPlane:
    replicas: 3
    instanceType: Standard_D8s_v5
  workers:
    replicas: 3
    minReplicas: 2
    maxReplicas: 20
    instanceType: Standard_D4s_v5
    autoscaling: false
lifecycle:
  maxTTLHours: 168
  defaultTTLHours: 72
  allowCustomTTL: true
  warnBeforeDestroyHours: 4
tags:
  required:
    Environment: development
  defaults:
    Purpose: development
    ManagedBy: ocpctl
    ClusterType: openshift
  allowUserTags: true
features:
  # Off-hours scaling is disabled for Azure OpenShift IPI: hibernate/resume
  # (az vm deallocate/start) is not yet implemented for PlatformAzure (see
  # handler_hibernate.go / handler_resume.go). Leaving this on would trigger a
  # hibernate the worker rejects. Re-enable once Azure hibernate is implemented.
  offHoursScaling: false
costControls:
  # List-price basis: OCP IPI: 3x D8s_v5 @0.384 + 3x D4s_v5 @0.192 + infra (East US)
  estimatedHourlyCost: 1.98
  maxMonthlyCost: 1450
  budgetAlertThreshold: 0.8
  warningMessage: Azure VMs billed per minute. Stop VMs to reduce costs.
platformConfig:
  azure:
    subscriptionId: ''
    baseDomainResourceGroup: azure-mg-dog8code-com-dns
    controlPlane:
      vmSize: Standard_D8s_v5
      osDiskSizeGB: 128
      osDiskType: Premium_LRS
    compute:
      vmSize: Standard_D4s_v5
      osDiskSizeGB: 128
      osDiskType: Premium_LRS
    # Ordered capacity-fallback matrix probed at create time. The worker tries
    # each candidate in order (the cluster's requested region is moved to the
    # front) and pins the create to the first whose zones all pass a real
    # `az vm create` allocation probe. Empirical capacity map (subscription
    # 72701f06…, 2026-09-01): eastus D8s_v5 unavailable in all zones but D8s_v4
    # allocates in zones 1&2; eastus2 D8s_v5 allocates in zones 1&3 (zone 2
    # restricted); centralus unprobed (last-resort). Update as capacity shifts.
    capacityFallback:
    - region: eastus
      zones: ["1", "2"]
      controlPlaneSku: Standard_D8s_v4
      computeSku: Standard_D4s_v4
    - region: eastus2
      zones: ["1", "3"]
      controlPlaneSku: Standard_D8s_v5
      computeSku: Standard_D4s_v5
    - region: centralus
      zones: ["1", "2", "3"]
      controlPlaneSku: Standard_D8s_v5
      computeSku: Standard_D4s_v5
metadata:
  capabilities:
  - OpenShift IPI on Azure VMs
  - Full control plane access
  capacity:
    nodes: 6 nodes (3 masters + 3 workers)
    vcpu: 40 vCPU total (24 master + 16 worker)
    memory: 160 GB RAM total (96 master + 64 worker)
  notes:
  - 'Masters: 3x Standard_D8s_v5 @ $0.672/hr = $2.02/hr'
  - 'Workers: 3x Standard_D4s_v5 @ $0.336/hr = $1.01/hr'
  - 'Total: ~$3.50/hr or $2,520/month always-on'
  - Hibernate/resume is NOT yet implemented for Azure OpenShift IPI; off-hours
    scaling is disabled. Control cost via TTL or manual destroy.

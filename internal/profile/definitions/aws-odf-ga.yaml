name: aws-odf-ga
displayName: AWS OpenShift Data Foundation (GA)
description: Cluster with ODF-capable workers (m8i.4xlarge) providing Ceph block, file,
  and object storage
platform: aws
clusterType: openshift
track: ga
enabled: true
credentialsMode: Auto
openshiftVersions:
  allowlist:
  - '4.16'
  - '4.17'
  - '4.18'
  - '4.19'
  - '4.20'
  - '4.21'
  - '4.22'
  default: '4.21'
regions:
  allowlist:
  - us-east-1
  - us-east-2
  - us-west-2
  - eu-south-2
  default: us-east-1
baseDomains:
  allowlist:
  - mg.dog8code.com
  default: mg.dog8code.com
compute:
  controlPlane:
    replicas: 3
    instanceType: m8i.2xlarge
    schedulable: false
  workers:
    replicas: 3
    minReplicas: 3
    maxReplicas: 3
    instanceType: m8i.4xlarge
    autoscaling: false
lifecycle:
  maxTTLHours: 168
  defaultTTLHours: 72
  allowCustomTTL: true
  warnBeforeDestroyHours: 2
networking:
  networkType: OVNKubernetes
  clusterNetworks:
  - cidr: 10.128.0.0/14
    hostPrefix: 23
  serviceNetwork:
  - 172.30.0.0/16
  machineNetwork:
  - cidr: 10.0.0.0/16
tags:
  required:
    Environment: production
  defaults:
    Purpose: storage
    ManagedBy: cluster-control-plane
    Workload: openshift-data-foundation
    Track: ga
  allowUserTags: true
features:
  offHoursScaling: false
  fipsMode: false
  privateCluster: false
costControls:
  estimatedHourlyCost: 3.60
  maxMonthlyCost: 2592
  budgetAlertThreshold: 0.8
  warningMessage: 3x m8i.4xlarge + 3x m8i.2xlarge cost ~$3.60/hr ($2,592/month).
platformConfig:
  aws:
    instanceMetadataService: required
    rootVolume:
      type: gp3
      size: 120
      iops: 3000
defaultAddons:
  - addonID: odf
    version: stable
metadata:
  capabilities:
  - ceph-storage
  notes:
  - Workers sized for ODF (m8i.4xlarge, 16 vCPU / 64 GiB each, 48 vCPU / 192 GiB aggregate)
  - Exceeds ODF minimum of 30 vCPU / 72 GiB with headroom for platform services
  - ODF addon pre-selected for automatic Ceph storage deployment
  - m8i instances available in us-east-1, us-east-2, us-west-2, eu-south-2

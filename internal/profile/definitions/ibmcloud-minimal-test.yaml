name: ibmcloud-minimal-test
displayName: IBM Cloud Minimal Test Cluster
description: Compact 3-node cluster for IBM Cloud testing (masters schedulable, no
  workers)
platform: ibmcloud
clusterType: openshift
track: ga
enabled: true
openshiftVersions:
  allowlist:
  - '4.17'
  - '4.18'
  - '4.19'
  - '4.20'
  - '4.21'
  - '4.22'
  default: '4.22'
regions:
  allowlist:
  - us-south
  - us-east
  - eu-de
  default: us-south
baseDomains:
  allowlist:
  - ibm.mg.dog8code.com
  default: ibm.mg.dog8code.com
compute:
  controlPlane:
    replicas: 3
    instanceType: bx2-4x16
    schedulable: true
  workers:
    replicas: 0
    minReplicas: 0
    maxReplicas: 3
    instanceType: bx2-8x32
    autoscaling: false
lifecycle:
  maxTTLHours: 72
  defaultTTLHours: 24
  allowCustomTTL: true
  warnBeforeDestroyHours: 1
networking:
  networkType: OVNKubernetes
  clusterNetworks:
  - cidr: 10.128.0.0/14
    hostPrefix: 23
  serviceNetwork:
  - 172.30.0.0/16
  machineNetwork:
  - cidr: 10.0.0.0/16
tags:
  required:
    Environment: test
  defaults:
    Purpose: testing
    ManagedBy: cluster-control-plane
  allowUserTags: true
features:
  # Off-hours scaling is disabled for IBM Cloud OpenShift: hibernate is not
  # implemented for this platform and falls back to DESTROY (see
  # handler_hibernate.go, hibernateOpenShift -> fallbackToDestroy for
  # PlatformIBMCloud). Leaving off-hours scaling on would silently destroy idle
  # clusters. Re-enable only once real IBM hibernate/resume is implemented.
  offHoursScaling: false
  fipsMode: false
  privateCluster: false
costControls:
  # List-price basis: ROKS: 3x bx2-4x16 @0.194 (0 workers) + infra (IBM list)
  estimatedHourlyCost: 0.8
  maxMonthlyCost: 580
  budgetAlertThreshold: 0.8
platformConfig:
  ibmcloud:
    resourceGroup: Default
metadata:
  notes:
    - "OCP 4.22 GA is supported (default). Provisioning uses manual CCO mode: openshift-install create manifests -> ccoctl ibmcloud (service IDs) -> openshift-install create cluster."
    - "Hibernate is NOT implemented for IBM Cloud OpenShift and falls back to destroy; off-hours scaling is disabled to avoid destroying idle clusters."
    - "Requires IBMCLOUD_API_KEY on workers (via worker.env / ibmcloud-login.sh) and versioned ccoctl-4.x + openshift-install-4.x (installed by ensure-installers.sh)."

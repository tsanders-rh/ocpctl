name: baremetal-rhwa-lab
displayName: Emulated Bare Metal RHWA Lab (Agent-Based)
description: Compact 3-node agent-based cluster on a nested-virt EC2 host for RHWA/Medik8s
  node remediation testing. Provisions the host, libvirt VMs and sushy-tools BMCs,
  then installs via the Agent-Based Installer. Workers join post-install via a metal3
  MachineSet so failure-injection scenarios have real BareMetalHosts to fence.
platform: baremetal
clusterType: openshift
track: ga
enabled: true
openshiftVersions:
  allowlist:
  - '4.20'
  - '4.21'
  - '4.22'
  default: '4.22'
regions:
  allowlist:
  - us-east-1
  - us-east-2
  - us-west-1
  - us-west-2
  default: us-east-1
baseDomains:
  allowlist:
  - migration.redhat.com
  default: migration.redhat.com
compute:
  controlPlane:
    replicas: 3
    instanceType: vm-8vcpu-20gb
    schedulable: true
  workers:
    # Post-install MachineSet scale target (rhwa-lab WORKER_COUNT). The agent
    # install-config always requests 0 workers (masters come up schedulable);
    # the baremetal lifecycle scales the metal3 MachineSet to this count after
    # the cluster is up, then marks the masters unschedulable.
    replicas: 3
    minReplicas: 0
    maxReplicas: 6
    instanceType: vm-4vcpu-16gb
    autoscaling: false
lifecycle:
  maxTTLHours: 168
  defaultTTLHours: 24
  allowCustomTTL: true
  warnBeforeDestroyHours: 2
networking:
  networkType: OVNKubernetes
  clusterNetworks:
  - cidr: 10.128.0.0/14
    hostPrefix: 23
  serviceNetwork:
  - 172.30.0.0/16
  machineNetwork:
  - cidr: 192.168.126.0/24
tags:
  required:
    Environment: lab
  defaults:
    Purpose: rhwa-medik8s-testing
    ManagedBy: cluster-control-plane
    Track: ga
    Category: node-remediation
  allowUserTags: true
features:
  offHoursScaling: false
  fipsMode: false
  privateCluster: false
costControls:
  # List-price basis: 1x m8i.12xlarge host @~2.42/hr (us-east-1) + 1TB gp3
  estimatedHourlyCost: 2.5
  maxMonthlyCost: 1825
  budgetAlertThreshold: 0.8
platformConfig:
  baremetal:
    hostInstanceType: m8i.12xlarge
    hostAMIOwner: '125523088429'
    fedoraRelease: '44'
    nodeDiskGB: 120
    spareWorkerCount: 3
    networkCIDR: 192.168.126.0/24
    apiVIP: 192.168.126.5
    ingressVIP: 192.168.126.6
    sushyPort: 8000
    odf:
      enabled: true
      # ceph sizing/channel default in-code (3 OSDs, 200 GB usable, replica 3,
      # squid, channel stable-<ocp-minor> resolved against the catalog).
metadata:
  notes:
  - Provisions the full substrate (EC2 host, libvirt VMs, sushy-tools BMCs) natively via ocpctl
  - Agent-based install; the agent ISO is built exactly once (rebuilding orphans cluster certs)
  - Control plane schedulable (3 nodes suitable for compact testing)
  - Spare worker VMs are BMC-configured but not installed, giving the MachineSet scale-up capacity
  - RHWA operators and fence_redfish fencing are configured natively during create (no separate addon)
  warnings:
  - Runs on a single large EC2 host; cost accrues whenever the host is running
  - Hibernate/resume and pooling are not supported for bare-metal clusters

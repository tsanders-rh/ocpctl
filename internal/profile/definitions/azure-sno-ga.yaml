name: azure-sno-ga
displayName: Azure Single Node OpenShift
description: Single-node OpenShift cluster on Azure (for dev/test workloads)
platform: azure
clusterType: openshift
track: ga
enabled: true
openshiftVersions:
  allowlist:
  - '4.18'
  - '4.19'
  - '4.20'
  - '4.21'
  - '4.22'
  default: '4.22'
regions:
  # User-selectable regions. Zone/SKU capacity within a region is NOT decided
  # here: the worker runs a real allocation probe at create time and pins the
  # single SNO node to the first capacityFallback candidate zone that actually
  # allocates (Azure zone capacity fluctuates and isn't predicted by list-skus).
  # See platformConfig.azure.capacityFallback below.
  allowlist:
  - eastus
  - eastus2
  - centralus
  default: eastus
baseDomains:
  allowlist:
  - azure.mg.dog8code.com
  default: azure.mg.dog8code.com
compute:
  controlPlane:
    replicas: 1
    instanceType: Standard_D8s_v5
  workers:
    replicas: 0
lifecycle:
  maxTTLHours: 168
  defaultTTLHours: 72
  allowCustomTTL: true
  warnBeforeDestroyHours: 4
tags:
  required:
    Environment: development
  defaults:
    Purpose: development
    ManagedBy: ocpctl
    ClusterType: sno
  allowUserTags: true
features:
  # Off-hours scaling hibernates via `az vm deallocate` (all VMs in the
  # cluster's resource group) and resumes via `az vm start` (see
  # handler_hibernate_azure.go / handler_resume_azure.go).
  offHoursScaling: true
costControls:
  # List-price basis: OCP SNO: 1x D8s_v5 @0.384 + infra (East US)
  estimatedHourlyCost: 0.48
  maxMonthlyCost: 350
  budgetAlertThreshold: 0.8
  warningMessage: SNO cannot scale workers. Stop VM to reduce costs.
platformConfig:
  azure:
    subscriptionId: ''
    baseDomainResourceGroup: azure-mg-dog8code-com-dns
    controlPlane:
      vmSize: Standard_D8s_v5
      osDiskSizeGB: 128
      osDiskType: Premium_LRS
    # Ordered capacity-fallback matrix probed at create time. SNO pins a single
    # node to one zone, so each candidate lists one known-good zone; the worker
    # probes it with a real `az vm create` and falls through to the next candidate
    # if it lacks capacity. Empirical map (subscription 72701f06…, 2026-09-01):
    # eastus D8s_v5 unavailable (use D8s_v4 zone 1); eastus2 D8s_v5 allocates in
    # zone 1; centralus unprobed (last-resort). Update as capacity shifts.
    capacityFallback:
    - region: eastus
      zones: ["1"]
      controlPlaneSku: Standard_D8s_v4
    - region: eastus2
      zones: ["1"]
      controlPlaneSku: Standard_D8s_v5
    - region: centralus
      zones: ["1"]
      controlPlaneSku: Standard_D8s_v5
metadata:
  capabilities:
  - Single Node OpenShift on Azure
  - Full OpenShift features on 1 node
  capacity:
    nodes: 1 node (combined control plane + worker)
    vcpu: 8 vCPU
    memory: 32 GB RAM
  notes:
  - 'Single node: 1x Standard_D8s_v5 @ $0.672/hr'
  - 'Total: ~$0.67/hr or $482/month always-on'
  - Hibernate/resume is NOT yet implemented for Azure OpenShift IPI; off-hours
    scaling is disabled. Control cost via TTL or manual destroy.
  - SNO is NOT recommended for production workloads
  - No high availability - single point of failure

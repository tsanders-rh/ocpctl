name: azure-sno-ga
displayName: Azure Single Node OpenShift
description: Single-node OpenShift cluster on Azure (for dev/test workloads)
platform: azure
clusterType: openshift
track: ga
enabled: true
openshiftVersions:
  allowlist:
  - '4.18'
  - '4.19'
  - '4.20'
  - '4.21'
  - '4.22'
  default: '4.22'
regions:
  allowlist:
  - eastus
  - eastus2
  - westus
  - westus2
  - centralus
  - northeurope
  - westeurope
  default: eastus2
baseDomains:
  allowlist:
  - azure.mg.dog8code.com
  default: azure.mg.dog8code.com
compute:
  controlPlane:
    replicas: 1
    instanceType: Standard_D8s_v5
  workers:
    replicas: 0
lifecycle:
  maxTTLHours: 168
  defaultTTLHours: 72
  allowCustomTTL: true
  warnBeforeDestroyHours: 4
tags:
  required:
    Environment: development
  defaults:
    Purpose: development
    ManagedBy: ocpctl
    ClusterType: sno
  allowUserTags: true
features:
  # Off-hours scaling is disabled for Azure OpenShift IPI: hibernate/resume
  # (az vm deallocate/start) is not yet implemented for PlatformAzure (see
  # handler_hibernate.go / handler_resume.go). Leaving this on would trigger a
  # hibernate the worker rejects. Re-enable once Azure hibernate is implemented.
  offHoursScaling: false
costControls:
  # List-price basis: OCP SNO: 1x D8s_v5 @0.384 + infra (East US)
  estimatedHourlyCost: 0.48
  maxMonthlyCost: 350
  budgetAlertThreshold: 0.8
  warningMessage: SNO cannot scale workers. Stop VM to reduce costs.
platformConfig:
  azure:
    subscriptionId: ''
    baseDomainResourceGroup: azure-mg-dog8code-com-dns
    controlPlane:
      vmSize: Standard_D8s_v5
      osDiskSizeGB: 128
      osDiskType: Premium_LRS
metadata:
  capabilities:
  - Single Node OpenShift on Azure
  - Full OpenShift features on 1 node
  capacity:
    nodes: 1 node (combined control plane + worker)
    vcpu: 8 vCPU
    memory: 32 GB RAM
  notes:
  - 'Single node: 1x Standard_D8s_v5 @ $0.672/hr'
  - 'Total: ~$0.67/hr or $482/month always-on'
  - Hibernate/resume is NOT yet implemented for Azure OpenShift IPI; off-hours
    scaling is disabled. Control cost via TTL or manual destroy.
  - SNO is NOT recommended for production workloads
  - No high availability - single point of failure
